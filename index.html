<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore four Raise Labs animation concepts.">
  <title>Animation Studies | The Raise Labs</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Lexend", "Segoe UI", sans-serif;
      color: #181a1b;
      background: #faf9f7;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 48px 24px;
    }

    main {
      width: min(100%, 960px);
    }

    .eyebrow {
      margin: 0 0 16px;
      color: #7b7770;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 7vw, 4.5rem);
      font-weight: 500;
      letter-spacing: -0.055em;
      line-height: 1;
    }

    .intro {
      max-width: 38rem;
      margin: 20px 0 40px;
      color: #5c5c5c;
      font-size: 1.05rem;
      line-height: 1.7;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .card {
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 24px;
      border: 1px solid #e2e0db;
      border-radius: 18px;
      background: #fff;
      color: inherit;
      text-decoration: none;
      transition: border-color 180ms ease, transform 180ms ease, box-shadow 180ms ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #c26d38;
      box-shadow: 0 12px 32px rgb(24 26 27 / 8%);
    }

    .card:focus-visible {
      outline: 3px solid #c26d38;
      outline-offset: 4px;
    }

    .number {
      color: #a65827;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.12em;
    }

    h2 {
      margin: 32px 0 8px;
      font-size: 1.35rem;
      font-weight: 500;
    }

    .action {
      margin-top: auto;
      color: #575551;
      font-size: 0.9rem;
    }

    @media (max-width: 680px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .card {
        min-height: 170px;
      }

      h2 {
        margin-top: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card {
        transition: none;
      }

      .card:hover {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">The Raise Labs · Animation studies</p>
    <h1>Choose an animation</h1>
    <p class="intro">Explore four ideas for how The Raise Labs identity can move as you scroll.</p>

    <nav class="cards" aria-label="Animation pages">
      <a class="card" href="./animation1.html">
        <span class="number">01</span>
        <h2>Animation 1</h2>
        <span class="action">View animation <span aria-hidden="true">→</span></span>
      </a>
      <a class="card" href="./animation2.html">
        <span class="number">02</span>
        <h2>Animation 2</h2>
        <span class="action">View animation <span aria-hidden="true">→</span></span>
      </a>
      <a class="card" href="./animation3.html">
        <span class="number">03</span>
        <h2>Animation 3</h2>
        <span class="action">View animation <span aria-hidden="true">→</span></span>
      </a>
      <a class="card" href="./animation4.html">
        <span class="number">04</span>
        <h2>Animation 4</h2>
        <span class="action">View animation <span aria-hidden="true">→</span></span>
      </a>
    </nav>
  </main>
</body>
</html>
